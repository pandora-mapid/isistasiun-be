# Server stack (dev or prod box). Self-contained — not an overlay on
# docker-compose.yml. Values come from .env on the box, which you create once
# from .env.deploy.example (the deploy workflow never touches it).
#
#   docker compose -f docker-compose.deploy.yml --env-file .env up -d
#
# TLS + routing is handled by the box's existing shared reverse proxy
# (trackster-nginx-1 on the `shared-web-net` network). This stack only exposes
# `backend` on that network as ${COMPOSE_PROJECT_NAME}-backend-1:8080 — add a
# server block there for SERVER_NAME pointing at that upstream.
#
# The pipeline container is behind the "batch" profile: `up` never starts it.
#   docker compose -f docker-compose.deploy.yml --env-file .env \
#     --profile batch run --rm pipeline python main.py <job> ...

name: ${COMPOSE_PROJECT_NAME:-isistasiun}

x-images:
  api: &api_image ghcr.io/pandora-mapid/isistasiun-be/api:${IMAGE_TAG:-dev}

networks:
  internal:
  shared-web-net:
    external: true

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  migrate:
    image: *api_image
    pull_policy: always
    restart: "no"
    env_file: .env
    entrypoint: ["sh", "-c", "migrate -path /app/migrations -database \"$$DATABASE_URL\" up"]
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  backend:
    image: *api_image
    pull_policy: always
    restart: always
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "8080"
    networks:
      - internal
      - shared-web-net
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *logging

  pipeline:
    image: ghcr.io/pandora-mapid/isistasiun-be/pipeline:${IMAGE_TAG:-dev}
    pull_policy: always
    profiles: [batch]
    restart: "no"
    env_file: .env
    command: ["python", "--version"]
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

volumes:
  pgdata:
