openapi: 3.0.3
info:
  title: Isi Stasiun Backend API
  version: 1.0.0
  description: REST API for station attributes, analytics, survey ingestion, pipeline callbacks, transparency, authentication, premium analysis, and AI copilot routing.
servers:
  - url: /
    description: Current backend origin
tags:
  - name: Health
  - name: Stations
  - name: Analytics
  - name: Confidence
  - name: Copilot
  - name: Survey
  - name: Pipeline
  - name: Transparency
  - name: Authentication
  - name: Premium
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check API process health
      operationId: getHealth
      responses:
        "200":
          description: API process is running
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
  /api/v1/stations:
    get:
      tags: [Stations]
      summary: List stations
      operationId: listStations
      parameters:
        - $ref: "#/components/parameters/AreaTypeQuery"
        - name: operator
          in: query
          schema: {type: string}
          description: Exact operator name filter
      responses:
        "200":
          $ref: "#/components/responses/StationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/stations/{id}:
    get:
      tags: [Stations]
      summary: Get station detail
      operationId: getStation
      parameters:
        - $ref: "#/components/parameters/StationIDPath"
      responses:
        "200":
          description: Station detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/Station"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/stations/{id}/entrances:
    get:
      tags: [Stations]
      summary: List station entrances
      operationId: listStationEntrances
      parameters:
        - $ref: "#/components/parameters/StationIDPath"
      responses:
        "200":
          description: Entrance list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/Entrance"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/spending-gap:
    get:
      tags: [Analytics]
      summary: List spending gap estimates
      operationId: listSpendingGap
      responses:
        "200": {$ref: "#/components/responses/SpendingGapList"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/spending-gap/{station_id}:
    get:
      tags: [Analytics]
      summary: List spending gap estimates for a station
      operationId: listStationSpendingGap
      parameters:
        - $ref: "#/components/parameters/StationIDNamedPath"
      responses:
        "200": {$ref: "#/components/responses/SpendingGapList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/category-gap:
    get:
      tags: [Analytics]
      summary: List unmet business categories
      operationId: listCategoryGap
      parameters:
        - $ref: "#/components/parameters/StationIDQuery"
      responses:
        "200":
          description: Category gap list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/CategoryGap"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/rent-flow-index:
    get:
      tags: [Analytics]
      summary: List rent-flow index results
      operationId: listRentFlowIndex
      parameters:
        - $ref: "#/components/parameters/StationIDQuery"
      responses:
        "200":
          description: Rent-flow index list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/RentFlowIndex"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/rental-assets:
    get:
      tags: [Analytics]
      summary: List source-backed rental assets
      operationId: listRentalAssets
      parameters:
        - $ref: "#/components/parameters/StationIDQuery"
        - name: station_code
          in: query
          schema: {type: string, example: MRI}
          description: Station code filter, useful when the caller has not mapped UUIDs yet
        - name: status
          in: query
          schema: {type: string, enum: [occupied, available, needs_verification]}
      responses:
        "200":
          description: Rental asset list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/RentalAsset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/event-potential:
    get:
      tags: [Analytics]
      summary: List event activation potential
      operationId: listEventPotential
      parameters:
        - $ref: "#/components/parameters/StationIDQuery"
      responses:
        "200":
          description: Event potential list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/EventPotential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/station-summary:
    get:
      tags: [Analytics]
      summary: Station-level rollup for the Compare View (2 simpul, free tier)
      description: >
        One row per station: a P10/P50/P90 range for potensi/tertangkap/gap, the
        capture rate, the F/E/C/V of the busiest observation point, and the
        category composition. `basis` says whether the range came from a real
        station-scoped Monte Carlo run (`monte-carlo-simpul`) or a stopgap
        aggregate of point figures (`agregat-titik`).
      operationId: listStationSummary
      responses:
        "200": {$ref: "#/components/responses/StationSummaryList"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/analytics/station-summary/{station_id}:
    get:
      tags: [Analytics]
      summary: Station-level rollup for one station
      operationId: getStationSummary
      parameters:
        - $ref: "#/components/parameters/StationIDNamedPath"
      responses:
        "200": {$ref: "#/components/responses/StationSummaryList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/confidence-layer:
    get:
      tags: [Confidence]
      summary: List confidence and sample density attributes
      operationId: listConfidenceLayer
      parameters:
        - $ref: "#/components/parameters/StationIDQuery"
      responses:
        "200":
          description: Confidence layer attributes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: {$ref: "#/components/schemas/ConfidenceLayerEntry"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/copilot/query:
    post:
      tags: [Copilot]
      summary: Forward a natural-language query to the AI service
      operationId: queryCopilot
      description: Public but rate-limited. Upstream failures currently return a stable fallback answer with HTTP 200.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CopilotQueryRequest"}
      responses:
        "200":
          description: AI response or degraded fallback
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/CopilotQueryResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/survey/flow-observations:
    post:
      tags: [Survey]
      summary: Submit a pedestrian flow observation
      operationId: createFlowObservation
      security: [{ServiceKeyAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKeyHeader"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateFlowObservationRequest"}
      responses:
        "201": {$ref: "#/components/responses/CreatedID"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
    get:
      tags: [Survey]
      summary: List pedestrian flow observations for QA
      operationId: listFlowObservations
      security: [{ServiceKeyAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StationIDQuery"
        - name: entrance_id
          in: query
          schema: {type: string, format: uuid}
        - name: time_slot
          in: query
          schema: {$ref: "#/components/schemas/TimeSlot"}
      responses:
        "200":
          description: At most 500 observations; current implementation may return null when empty
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        nullable: true
                        items: {$ref: "#/components/schemas/FlowObservation"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/survey/entry-conversion-observations:
    post:
      tags: [Survey]
      summary: Submit an entry and purchase conversion observation
      operationId: createEntryConversionObservation
      security: [{ServiceKeyAuth: []}]
      parameters: [{$ref: "#/components/parameters/IdempotencyKeyHeader"}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateEntryConversionRequest"}
      responses:
        "201": {$ref: "#/components/responses/CreatedID"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /api/v1/pipeline/extractions/struk:
    post:
      tags: [Pipeline]
      summary: Ingest receipt OCR output
      operationId: ingestStrukExtraction
      security: [{ServiceKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StrukExtractionCallback"}
      responses:
        "200": {$ref: "#/components/responses/Ingested"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/pipeline/extractions/properti:
    post:
      tags: [Pipeline]
      summary: Ingest property OCR output
      operationId: ingestPropertiExtraction
      security: [{ServiceKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PropertiExtractionCallback"}
      responses:
        "200": {$ref: "#/components/responses/Ingested"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/pipeline/extractions/gerai:
    post:
      tags: [Pipeline]
      summary: Ingest store classification output
      operationId: ingestGeraiExtraction
      security: [{ServiceKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GeraiClassificationCallback"}
      responses:
        "200": {$ref: "#/components/responses/Ingested"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/pipeline/simulations/monte-carlo:
    post:
      tags: [Pipeline]
      summary: Ingest a Monte Carlo spending-gap result
      operationId: ingestMonteCarloResult
      security: [{ServiceKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MonteCarloResultCallback"}
      responses:
        "200": {$ref: "#/components/responses/Ingested"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/pipeline/simulations/station-summary:
    post:
      tags: [Pipeline]
      summary: Ingest a station-scoped Monte Carlo rollup
      description: >-
        Whole-station, whole-day figure behind the Compare View. Separate from
        /pipeline/simulations/monte-carlo, which is per (station, time_slot)
        and carries only P10/P90. Upserts on (station_id, day_type), so a
        retried pipeline run replaces the row instead of duplicating it.
      operationId: ingestStationSummary
      security: [{ServiceKeyAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StationSummaryCallback"}
      responses:
        "200": {$ref: "#/components/responses/Ingested"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/transparency/struk/{id}:
    get:
      tags: [Transparency]
      summary: Get receipt transparency record
      operationId: getStrukTransparency
      parameters: [{$ref: "#/components/parameters/RecordIDPath"}]
      responses:
        "200": {$ref: "#/components/responses/TransparencyRecord"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/transparency/gerai/{id}:
    get:
      tags: [Transparency]
      summary: Get store transparency record
      operationId: getGeraiTransparency
      parameters: [{$ref: "#/components/parameters/RecordIDPath"}]
      responses:
        "200": {$ref: "#/components/responses/TransparencyRecord"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/transparency/properti/{id}:
    get:
      tags: [Transparency]
      summary: Get property transparency record
      operationId: getPropertiTransparency
      parameters: [{$ref: "#/components/parameters/RecordIDPath"}]
      responses:
        "200": {$ref: "#/components/responses/TransparencyRecord"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/transparency/station/{id}/records:
    get:
      tags: [Transparency]
      summary: List transparency records for a station
      operationId: listStationTransparency
      parameters: [{$ref: "#/components/parameters/StationIDPath"}]
      responses:
        "200":
          description: Current implementation may return null when empty
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        nullable: true
                        items: {$ref: "#/components/schemas/TransparencyRecord"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Log in an operator
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          $ref: "#/components/responses/AuthSession"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh an access token
      operationId: refreshToken
      description: Rotates the HttpOnly refresh cookie and returns a new in-memory access token.
      security: [{RefreshCookie: []}]
      responses:
        "200": {$ref: "#/components/responses/AuthSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current refresh session
      operationId: logout
      description: Revokes the complete refresh-token rotation family and clears the HttpOnly cookie. Idempotent when no cookie exists.
      security: [{RefreshCookie: []}]
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SuccessEnvelope"}
        "500": {$ref: "#/components/responses/InternalError"}
  /api/v1/premium/deep-analysis/{station_id}:
    get:
      tags: [Premium]
      summary: Get premium deep analysis
      operationId: getPremiumDeepAnalysis
      description: Aggregated paid-tier analysis for one station. Access JWT and operator/admin role required.
      security: [{BearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/StationIDNamedPath"
      responses:
        "200":
          description: Deep analysis bundle
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessEnvelope"
                  - type: object
                    properties:
                      data: {$ref: "#/components/schemas/DeepAnalysis"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
components:
  securitySchemes:
    ServiceKeyAuth:
      type: apiKey
      in: header
      name: X-Service-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    RefreshCookie:
      type: apiKey
      in: cookie
      name: isi_stasiun_refresh
  parameters:
    AreaTypeQuery:
      name: area_type
      in: query
      schema: {$ref: "#/components/schemas/AreaType"}
    StationIDPath:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StationIDNamedPath:
      name: station_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    StationIDQuery:
      name: station_id
      in: query
      schema: {type: string, format: uuid}
    RecordIDPath:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        Opaque client-generated key. Re-submitting with the same key returns
        the original observation's id instead of inserting a duplicate.
      schema: {type: string, maxLength: 255}
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorEnvelope"}
    StationList:
      description: Station list
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/Station"}
    SpendingGapList:
      description: Spending gap rows
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/SpendingGap"}
    StationSummaryList:
      description: Station-level rollup rows, biggest daily gap first
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data:
                    type: array
                    items: {$ref: "#/components/schemas/StationSummary"}
          example:
            success: true
            message: Berhasil mengambil ringkasan simpul
            data:
              - station_id: a0000000-0000-4000-8000-000000000001
                station_name: Manggarai
                typology: mixed
                day_type: weekday
                pintu_dicacah: 3
                pintu_ditahan: 0
                potensi: {p10: 7200000, p50: 8200000, p90: 10500000}
                tertangkap: {p10: 2200000, p50: 2500000, p90: 3200000}
                gap: {p10: 5000000, p50: 5700000, p90: 7300000}
                capture_rate: 0.3049
                confidence: {min: 0.77, max: 0.87}
                struk_terbaca: 713
                peak:
                  point_label: Koridor Transit Utara
                  time_slot: morning
                  f: 1574
                  e: 0.07
                  c: 0.66
                  v: 30000
                  gap: {p10: 860000, p50: 1100000, p90: 1520000}
                composition:
                  - {category: makanan_minuman, demand_share: 0.4666, gerai_count: 3, is_missing: false}
                  - {category: ritel_kemasan, demand_share: 0.1837, gerai_count: 2, is_missing: true}
                  - {category: apotek_kesehatan, demand_share: 0.1061, gerai_count: 0, is_missing: true}
                basis: monte-carlo-simpul
                computed_at: "2026-08-20T10:00:00Z"
    CreatedID:
      description: Record created
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: {$ref: "#/components/schemas/CreatedID"}
    Ingested:
      description: Callback ingested
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: {$ref: "#/components/schemas/Ingested"}
    TransparencyRecord:
      description: Transparency record
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: {$ref: "#/components/schemas/TransparencyRecord"}
    AuthSession:
      description: Access token and operator identity. The refresh token is set only as an HttpOnly cookie.
      headers:
        Set-Cookie:
          description: HttpOnly refresh-session cookie, scoped to /api/v1/auth
          schema: {type: string}
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/SuccessEnvelope"
              - type: object
                properties:
                  data: {$ref: "#/components/schemas/AuthSession"}
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [true]}
        message: {type: string}
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success: {type: boolean, enum: [false]}
        message: {type: string}
        data: {nullable: true}
    Health:
      type: object
      required: [app, version]
      properties:
        app: {type: string, example: Isi Stasiun Backend}
        version: {type: string, example: 1.0.0}
    AreaType:
      type: string
      enum: [residential, office, mixed]
    TimeSlot:
      type: string
      enum: [morning, midday, evening, night]
    Category:
      type: string
      enum: [makanan_minuman, ritel_kemasan, apotek_kesehatan, jasa, lainnya]
    Station:
      type: object
      required: [id, name, code, operator, area_type, latitude, longitude, entrance_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        operator: {type: string}
        area_type: {$ref: "#/components/schemas/AreaType"}
        latitude: {type: number, format: double, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, minimum: -180, maximum: 180}
        entrance_count: {type: integer, minimum: 0}
    Entrance:
      type: object
      required: [id, label, latitude, longitude]
      properties:
        id: {type: string, format: uuid}
        label: {type: string}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
    SpendingGap:
      type: object
      required: [station_id, station_name, potential_low_p10, potential_high_p90, captured_low_p10, captured_high_p90, gap_low_p10, gap_high_p90, time_slot, computed_at]
      properties:
        station_id: {type: string, format: uuid}
        station_name: {type: string}
        potential_low_p10: {type: number, format: double}
        potential_high_p90: {type: number, format: double}
        captured_low_p10: {type: number, format: double}
        captured_high_p90: {type: number, format: double}
        gap_low_p10: {type: number, format: double}
        gap_high_p90: {type: number, format: double}
        time_slot: {$ref: "#/components/schemas/TimeSlot"}
        computed_at: {type: string, format: date-time}
    MoneyRange:
      type: object
      required: [p10, p50, p90]
      properties:
        p10: {type: number, format: double}
        p50: {type: number, format: double}
        p90: {type: number, format: double}
    StationSummary:
      type: object
      required: [station_id, station_name, typology, day_type, pintu_dicacah, pintu_ditahan, potensi, tertangkap, gap, capture_rate, confidence, struk_terbaca, peak, composition, basis, computed_at]
      properties:
        station_id: {type: string, format: uuid}
        station_name: {type: string}
        typology: {$ref: "#/components/schemas/AreaType"}
        day_type: {type: string, enum: [weekday, weekend]}
        pintu_dicacah: {type: integer, minimum: 0}
        pintu_ditahan: {type: integer, minimum: 0}
        potensi: {$ref: "#/components/schemas/MoneyRange"}
        tertangkap: {$ref: "#/components/schemas/MoneyRange"}
        gap: {$ref: "#/components/schemas/MoneyRange"}
        capture_rate: {type: number, format: double, nullable: true, description: captured_p50 / potential_p50}
        confidence:
          type: object
          nullable: true
          required: [min, max]
          properties:
            min: {type: number, format: double}
            max: {type: number, format: double}
        struk_terbaca: {type: integer, minimum: 0}
        peak:
          type: object
          nullable: true
          required: [point_label, time_slot, f, e, c, v, gap]
          properties:
            point_label: {type: string}
            time_slot: {$ref: "#/components/schemas/TimeSlot"}
            f: {type: number, format: double}
            e: {type: number, format: double}
            c: {type: number, format: double}
            v: {type: number, format: double}
            gap: {$ref: "#/components/schemas/MoneyRange"}
        composition:
          type: array
          items:
            type: object
            required: [category, demand_share, gerai_count, is_missing]
            properties:
              category: {$ref: "#/components/schemas/Category"}
              demand_share: {type: number, format: double}
              gerai_count: {type: integer, minimum: 0}
              is_missing: {type: boolean}
        basis: {type: string, enum: [monte-carlo-simpul, agregat-titik]}
        computed_at: {type: string, format: date-time}
    CategoryGap:
      type: object
      required: [station_id, category, demand_in_area, available_in_station, demand_count]
      properties:
        station_id: {type: string, format: uuid}
        category: {$ref: "#/components/schemas/Category"}
        demand_in_area: {type: boolean}
        available_in_station: {type: boolean}
        demand_count: {type: integer, description: "POI count of this category within the station catchment (~800 m)"}
    RentFlowIndex:
      type: object
      required: [plot_id, station_id, offered_rent, measured_flow, index, is_outlier]
      properties:
        plot_id: {type: string}
        station_id: {type: string, format: uuid}
        offered_rent: {type: number, format: double}
        measured_flow: {type: number, format: double}
        index: {type: number, format: double}
        is_outlier: {type: boolean}
    EventPotential:
      type: object
      required: [station_id, zone_id, activation_score, recommended_slot]
      properties:
        station_id: {type: string, format: uuid}
        zone_id: {type: string}
        activation_score: {type: number, format: double}
        recommended_slot: {type: string, nullable: true}
    RentalAsset:
      type: object
      required: [id, station_id, station_name, station_code, source_id, data_source, location_name, plot_name, latitude, longitude, rented, availability_status, commercial_value_visible]
      properties:
        id: {type: string, format: uuid}
        station_id: {type: string, format: uuid}
        station_name: {type: string}
        station_code: {type: string}
        source_id: {type: string}
        data_source: {type: string, enum: [space_kai, field_survey]}
        location_name: {type: string}
        plot_name: {type: string}
        area_name: {type: string, nullable: true}
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
        land_area: {type: number, format: double, nullable: true}
        building_area: {type: number, format: double, nullable: true}
        rented: {type: boolean}
        availability_status: {type: string, enum: [occupied, available, needs_verification]}
        commercial_value: {type: number, format: double, nullable: true}
        commercial_value_visible: {type: boolean}
        source_updated_at: {type: string, format: date-time, nullable: true}
        note: {type: string, nullable: true}
    ConfidenceLayerEntry:
      type: object
      required: [station_id, zone_id, sample_count, is_thin_sample, confidence_score]
      properties:
        station_id: {type: string, format: uuid}
        zone_id: {type: string}
        sample_count: {type: integer, minimum: 0}
        is_thin_sample: {type: boolean}
        confidence_score: {type: number, format: double}
    CopilotQueryRequest:
      type: object
      required: [query]
      properties:
        query: {type: string, minLength: 1, maxLength: 500, example: "Stasiun mana yang memiliki spending gap tertinggi?"}
        station_id: {type: string, format: uuid}
    CopilotQueryResponse:
      type: object
      required: [answer]
      properties:
        answer: {type: string}
        suggested_layers:
          type: array
          items: {type: string}
        spatial_filter:
          type: object
          additionalProperties: true
    CreateFlowObservationRequest:
      type: object
      required: [station_id, entrance_id, time_slot, observed_at, block_number, pedestrian_count, direction, surveyor_id]
      properties:
        station_id: {type: string, format: uuid}
        entrance_id: {type: string, format: uuid}
        time_slot: {$ref: "#/components/schemas/TimeSlot"}
        observed_at: {type: string, format: date-time}
        block_number: {type: integer, enum: [1, 2]}
        pedestrian_count: {type: integer, minimum: 0}
        direction: {type: string, enum: [in, out]}
        weather_note: {type: string}
        surveyor_id: {type: string}
    FlowObservation:
      allOf:
        - $ref: "#/components/schemas/CreateFlowObservationRequest"
        - type: object
          required: [id, created_at]
          properties:
            id: {type: string, format: uuid}
            created_at: {type: string, format: date-time}
    CreateEntryConversionRequest:
      type: object
      required: [station_id, gerai_id, category, time_slot, observed_at, block_number, passers_by, entered_count, completed_purchase_count, surveyor_id]
      properties:
        station_id: {type: string, format: uuid}
        gerai_id: {type: string, format: uuid}
        category: {$ref: "#/components/schemas/Category"}
        time_slot: {$ref: "#/components/schemas/TimeSlot"}
        observed_at: {type: string, format: date-time}
        block_number: {type: integer, enum: [1, 2]}
        passers_by: {type: integer, minimum: 0}
        entered_count: {type: integer, minimum: 0}
        completed_purchase_count: {type: integer, minimum: 0}
        surveyor_id: {type: string}
    StrukExtractionCallback:
      type: object
      required: [job_id, source_ref, station_id, category, final_amount, payment_method, transacted_at, confidence, is_ambiguous]
      properties:
        job_id: {type: string}
        source_ref: {type: string, description: R2 object key of the source photo}
        photo_url:
          type: string
          format: uri
          description: >
            Redacted, publicly servable URL of the source photo. When present the
            callback also writes a linked transparency_struk evidence card.
        station_id: {type: string, format: uuid}
        category: {$ref: "#/components/schemas/Category"}
        final_amount: {type: number, format: double, minimum: 0}
        payment_method: {type: string}
        transacted_at: {type: string, format: date-time}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
        is_ambiguous: {type: boolean}
    PropertiExtractionCallback:
      type: object
      required: [job_id, source_ref, station_id, plot_id, offered_rent, area_sqm, confidence]
      properties:
        job_id: {type: string}
        source_ref: {type: string, description: R2 object key of the source photo}
        photo_url: {type: string, format: uri, description: Redacted public URL; when present writes a linked transparency_properti card}
        station_id: {type: string, format: uuid}
        plot_id: {type: string}
        offered_rent: {type: number, format: double, minimum: 0}
        area_sqm: {type: number, format: double, minimum: 0}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
    GeraiClassificationCallback:
      type: object
      required: [job_id, source_ref, station_id, gerai_id, category, visibility, confidence]
      properties:
        job_id: {type: string}
        source_ref: {type: string, description: R2 object key of the source photo}
        photo_url: {type: string, format: uri, description: Redacted public URL; when present writes a linked transparency_gerai card}
        station_id: {type: string, format: uuid}
        gerai_id: {type: string, format: uuid}
        category: {$ref: "#/components/schemas/Category"}
        visibility: {type: string, enum: [high, medium, low]}
        confidence: {type: number, format: double, minimum: 0, maximum: 1}
    MonteCarloResultCallback:
      type: object
      required: [job_id, station_id, time_slot, potential_low_p10, potential_high_p90, captured_low_p10, captured_high_p90, iterations]
      properties:
        job_id: {type: string}
        station_id: {type: string, format: uuid}
        time_slot: {$ref: "#/components/schemas/TimeSlot"}
        potential_low_p10: {type: number, format: double}
        potential_high_p90: {type: number, format: double}
        captured_low_p10: {type: number, format: double}
        captured_high_p90: {type: number, format: double}
        iterations: {type: integer, minimum: 10000, description: Full Monte Carlo run per methodology 3.3}
    StationSummaryCallback:
      type: object
      description: >-
        Mirrors StationSummary field for field (minus the server-derived
        station_name/typology/computed_at) so a rollup round-trips through the
        API unchanged. `gap` is simulated per iteration, not derived by
        subtracting the potensi/tertangkap percentiles.
      required: [job_id, station_id, day_type, iterations, potensi, tertangkap, gap, basis]
      properties:
        job_id: {type: string}
        station_id: {type: string, format: uuid}
        day_type: {type: string, enum: [weekday, weekend]}
        iterations: {type: integer, minimum: 10000, description: Validated, not stored — guards against publishing a truncated run}
        potensi: {$ref: "#/components/schemas/MoneyRange"}
        tertangkap: {$ref: "#/components/schemas/MoneyRange"}
        gap: {$ref: "#/components/schemas/MoneyRange"}
        capture_rate: {type: number, format: double, nullable: true}
        confidence:
          type: object
          nullable: true
          required: [min, max]
          properties:
            min: {type: number, format: double}
            max: {type: number, format: double}
        struk_terbaca: {type: integer, minimum: 0}
        pintu_dicacah: {type: integer, minimum: 0}
        pintu_ditahan: {type: integer, minimum: 0}
        peak:
          type: object
          nullable: true
          required: [point_label, time_slot, f, e, c, v, gap]
          properties:
            point_label: {type: string}
            time_slot: {$ref: "#/components/schemas/TimeSlot"}
            f: {type: number, format: double}
            e: {type: number, format: double}
            c: {type: number, format: double}
            v: {type: number, format: double}
            gap: {$ref: "#/components/schemas/MoneyRange"}
        composition:
          type: array
          items:
            type: object
            required: [category, demand_share, gerai_count, is_missing]
            properties:
              category: {$ref: "#/components/schemas/Category"}
              demand_share: {type: number, format: double}
              gerai_count: {type: integer, minimum: 0}
              is_missing: {type: boolean}
        basis: {type: string, enum: [monte-carlo-simpul, agregat-titik]}
    CreatedID:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
    Ingested:
      type: object
      required: [job_id, status]
      properties:
        job_id: {type: string}
        status: {type: string, enum: [ingested]}
    TransparencyRecord:
      type: object
      required: [id, type, station_id, photo_url, ai_reading, confidence_score, is_ambiguous]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [struk, gerai, properti]}
        station_id: {type: string, format: uuid}
        photo_url: {type: string, format: uri}
        ai_reading: {type: string, description: JSON or summary encoded as text}
        confidence_score: {type: number, format: double}
        is_ambiguous: {type: boolean}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    AuthSession:
      type: object
      required: [access_token, expires_in, user]
      properties:
        access_token: {type: string}
        expires_in: {type: integer, description: Access token lifetime in seconds}
        user: {$ref: "#/components/schemas/AuthUser"}
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        role: {type: string, enum: [operator, admin]}
    DeepAnalysis:
      type: object
      required: [station, spending_gap, totals, category_gaps, rent_flow_plots, event_potential, confidence, coverage]
      properties:
        station: {$ref: "#/components/schemas/PremiumStation"}
        spending_gap:
          type: array
          items: {$ref: "#/components/schemas/PremiumSpendingGapSlot"}
        totals: {$ref: "#/components/schemas/PremiumTotals"}
        category_gaps:
          type: array
          items: {$ref: "#/components/schemas/PremiumCategoryGap"}
        rent_flow_plots:
          type: array
          items: {$ref: "#/components/schemas/PremiumRentFlowPlot"}
        event_potential:
          type: array
          items: {$ref: "#/components/schemas/PremiumEventPotential"}
        confidence:
          type: array
          items: {$ref: "#/components/schemas/PremiumConfidence"}
        coverage: {$ref: "#/components/schemas/PremiumCoverage"}
    PremiumStation:
      type: object
      required: [id, name, code, operator, area_type, entrance_count]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        code: {type: string}
        operator: {type: string}
        area_type: {type: string}
        entrance_count: {type: integer}
    PremiumRange:
      type: object
      required: [p10, p90]
      properties:
        p10: {type: number}
        p90: {type: number}
    PremiumSpendingGapSlot:
      type: object
      required: [time_slot, potential, captured, gap, computed_at]
      properties:
        time_slot: {type: string}
        potential: {$ref: "#/components/schemas/PremiumRange"}
        captured: {$ref: "#/components/schemas/PremiumRange"}
        gap: {$ref: "#/components/schemas/PremiumRange"}
        computed_at: {type: string}
    PremiumTotals:
      type: object
      required: [potential, captured, gap, slots_with_data, slots_expected]
      properties:
        potential: {$ref: "#/components/schemas/PremiumRange"}
        captured: {$ref: "#/components/schemas/PremiumRange"}
        gap: {$ref: "#/components/schemas/PremiumRange"}
        slots_with_data: {type: integer}
        slots_expected: {type: integer}
        capture_rate_p50: {type: number, nullable: true}
    PremiumCategoryGap:
      type: object
      required: [category, demand_in_area, available_in_station, missing]
      properties:
        category: {type: string}
        demand_in_area: {type: boolean}
        available_in_station: {type: boolean}
        missing: {type: boolean}
    PremiumRentFlowPlot:
      type: object
      required: [plot_id, offered_rent, measured_flow, index, is_outlier]
      properties:
        plot_id: {type: string, format: uuid}
        offered_rent: {type: number}
        measured_flow: {type: number}
        index: {type: number}
        is_outlier: {type: boolean}
    PremiumEventPotential:
      type: object
      required: [zone_id, activation_score, recommended_slot]
      properties:
        zone_id: {type: string, format: uuid}
        activation_score: {type: number}
        recommended_slot: {type: string}
    PremiumConfidence:
      type: object
      required: [zone_id, sample_count, is_thin_sample, confidence_score]
      properties:
        zone_id: {type: string, format: uuid}
        sample_count: {type: integer}
        is_thin_sample: {type: boolean}
        confidence_score: {type: number}
    PremiumCoverage:
      type: object
      required: [thin_sample_zones, total_zones, struk_total, struk_ambiguous, struk_usable, has_complete_slots]
      properties:
        thin_sample_zones: {type: integer}
        total_zones: {type: integer}
        struk_total: {type: integer}
        struk_ambiguous: {type: integer}
        struk_usable: {type: integer}
        has_complete_slots: {type: boolean}
