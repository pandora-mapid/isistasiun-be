services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: isistasiun-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: isistasiun-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  # `make be-migrate-up` / `be-migrate-down`. Not started by `up`.
  migrate:
    image: migrate/migrate:v4.17.1
    profiles: [tools]
    env_file: .env
    volumes:
      - ./backend/migrations:/migrations
    entrypoint: ["/bin/sh", "-c"]
    command: 'migrate -path /migrations -database "$$DATABASE_URL" up'
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: isistasiun-pipeline
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./pipeline:/app
    depends_on:
      postgres:
        condition: service_healthy
    # Batch jobs are triggered via `docker compose exec pipeline python main.py <job>`
    # or scheduled externally with cron; this keeps it from idling as a fake "server".
    command: ["sleep", "infinity"]

volumes:
  pgdata:
